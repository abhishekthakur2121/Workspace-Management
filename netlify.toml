# Overrides the build settings in the Netlify UI.
# Publish must be .next so Netlify's Next.js runtime packages the app into
# server functions; publishing the repo root serves the source as static files.
[build]
  command = "npm run build"
  publish = ".next"

# NEON_BRANCH holds the branch name ("production"), not a secret; scanning it
# flags every occurrence of the word "production" and fails the build.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEON_BRANCH"
